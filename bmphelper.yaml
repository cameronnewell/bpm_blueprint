template:
  - trigger:
      - platform: mqtt
        topic: "bifrost/audio/bpm"
    sensor:
      - name: "BPM Debounced"
        unique_id: bpm_debounced
        unit_of_measurement: "bpm"
        state: >
          {% set new_bpm = trigger.payload | float(0) %}
          {% set old_bpm = this.state | float(0) if this.state not in ['unknown', 'unavailable', none] else 0 %}
          {% if old_bpm == 0 or (new_bpm - old_bpm) | abs >= 4 %}
            {{ new_bpm }}
          {% else %}
            {{ old_bpm }}
          {% endif %}
