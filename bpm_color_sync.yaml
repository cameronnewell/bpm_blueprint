blueprint:
  name: BPM Color Cycle
  description: >
    A callable script that cycles target lights through a color palette at
    a tempo derived from a BPM sensor, re-read every cycle so tempo drifts
    with the music in real time. Mode (daily/party) and all tuning are
    fixed at creation time - no runtime dropdowns or helpers. Start with
    script.turn_on, stop with script.turn_off, from any other automation.
  domain: script
  input:
    bpm_sensor:
      name: BPM Sensor
      description: Your debounced BPM sensor, e.g. sensor.bpm_debounced
      selector: {entity: {domain: sensor}}
    target_lights:
      name: Target Lights
      selector:
        target:
          entity:
            domain: light
    mode:
      name: Mode
      selector:
        select:
          options: ["daily", "party"]
    daily_divisor:
      name: Daily mode - beats per color change
      default: 16
      selector: {number: {min: 1, max: 64, mode: box}}
    party_step_beats:
      name: Party mode - beats per color change
      default: 1
      selector: {number: {min: 1, max: 64, mode: box}}
    party_transition_fraction:
      name: Party mode - transition as fraction of period
      default: 0.3
      selector: {number: {min: 0.05, max: 1, step: 0.05, mode: slider}}
    daily_transition_fraction:
      name: Daily mode - transition as fraction of period
      default: 0.9
      selector: {number: {min: 0.05, max: 1, step: 0.05, mode: slider}}
    party_palette:
      name: Party Palette (list of [hue, saturation] pairs)
      default:
        - [330, 90]
        - [10, 95]
        - [50, 90]
        - [190, 85]
        - [280, 85]
      selector: {object:}
    daily_palette:
      name: Daily Palette (list of [hue, saturation] pairs)
      default:
        - [20, 40]
        - [30, 55]
        - [45, 35]
        - [15, 60]
        - [195, 35]
        - [210, 45]
        - [180, 30]
        - [220, 50]
      selector: {object:}

m
