blueprint:
  name: BPM Color Sync
  description: >
    Cycles a set of lights through a color palette at a tempo derived from
    a debounced BPM sensor. Supports daily (gentle, divisor-based) and
    party (fast, fixed step) modes via a shared mode helper. Create one
    instance per light group.
  domain: automation
  input:
    bpm_sensor:
      name: BPM Sensor
      description: Point this at your debounced BPM sensor (e.g. sensor.bpm_debounced)
      selector: {entity: {domain: sensor}}
    mode_helper:
      name: Mode Helper (expects off/daily/party)
      selector: {entity: {domain: input_select}}
    divisor_helper:
      name: Divisor Helper (daily mode beats-per-change)
      selector: {entity: {domain: input_select}}
    target_lights:
      name: Target Lights
      selector:
        target:
          entity:
            domain: light
    party_step_beats:
      name: Party mode - beats per color change
      default: 1
      selector: {number: {min: 1,
